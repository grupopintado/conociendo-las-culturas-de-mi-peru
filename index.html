<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conociendo las culturas de mi Perú</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Partículas / Nubes de fondo -->
    <div id="particles-bg"></div>

    <!-- Pantalla Principal -->
    <main id="main-menu" class="active">
        <header>
            <h1>Conociendo las culturas de mi Perú</h1>
            <p>Descubre nuestro legado ancestral</p>
        </header>

        <div class="cultures-grid">
            <article class="culture-card" data-culture="chavin">
                <img src="chavin.png" alt="Cultura Chavín" fetchpriority="high" decoding="async">
                <div class="card-content">
                    <h2>Chavín</h2>
                </div>
            </article>

            <article class="culture-card" data-culture="paracas">
                <img src="paracas.png" alt="Cultura Paracas" loading="lazy" decoding="async">
                <div class="card-content">
                    <h2>Paracas</h2>
                </div>
            </article>

            <article class="culture-card" data-culture="nazca">
                <img src="nazca.png" alt="Cultura Nazca" loading="lazy" decoding="async">
                <div class="card-content">
                    <h2>Nazca</h2>
                </div>
            </article>

            <article class="culture-card" data-culture="moche">
                <img src="moche.png" alt="Cultura Moche" loading="lazy" decoding="async">
                <div class="card-content">
                    <h2>Moche</h2>
                </div>
            </article>

            <article class="culture-card" data-culture="tiahuanaco">
                <img src="tiahuanaco.png" alt="Cultura Tiahuanaco" loading="lazy" decoding="async">
                <div class="card-content">
                    <h2>Tiahuanaco</h2>
                </div>
            </article>

            <article class="culture-card" data-culture="wari">
                <img src="wari.png" alt="Cultura Wari" loading="lazy" decoding="async">
                <div class="card-content">
                    <h2>Wari</h2>
                </div>
            </article>

            <article class="culture-card" data-culture="chimu">
                <img src="chimu.png" alt="Cultura Chimú" loading="lazy" decoding="async">
                <div class="card-content">
                    <h2>Chimú</h2>
                </div>
            </article>

            <article class="culture-card" data-culture="inca">
                <img src="inca.png" alt="Cultura Inca" loading="lazy" decoding="async">
                <div class="card-content">
                    <h2>Inca</h2>
                </div>
            </article>
        </div>
    </main>

    <!-- Transición cinematográfica -->
    <div id="transition-overlay"></div>

    <!-- Sección de Detalle de Cultura -->
    <section id="culture-detail" class="hidden">
        <button id="back-btn">← Volver al menú</button>
        <div class="detail-container">
            <h1 id="detail-title">Nombre de Cultura</h1>
            
            <div class="detail-content">
                <div class="text-section">
                    <h3>Descripción</h3>
                    <p id="detail-desc">Descripción aquí.</p>
                    
                    <h3>Contexto Histórico</h3>
                    <p id="detail-context">Contexto aquí.</p>

                    <h3>Objetos Representativos</h3>
                    <ul id="detail-objects">
                        <!-- Lista generada dinámicamente -->
                    </ul>
                </div>
                
                <div class="image-gallery">
                    <img id="detail-main-img" src="" alt="Imagen Principal" loading="lazy" decoding="async">
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
